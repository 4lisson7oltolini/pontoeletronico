name: Envio de relatórios mensais

on:
  schedule:
    - cron: "*/15 * 1,2 * *"
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-report-delivery
  cancel-in-progress: false

jobs:
  send-monthly-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Verificar e enviar relatórios pendentes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'America/Sao_Paulo' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS }}
        run: python -m scripts.send_monthly_reports
